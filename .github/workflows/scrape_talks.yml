name: Scrape Talk Locations
on:
  push:
    paths:
      - 'talks/**'
      - 'talkmap.ipynb'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Updated from v2 to v4 for Node 24 compatibility
      - uses: actions/checkout@v4

      # 2. Updated from v2 to v5 for Node 24 compatibility
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Explicitly install dependencies and register the standard kernel
      - name: Install dependencies
        run: |
          pip install jupyter nbconvert ipykernel python-frontmatter getorg geopy

      # 4. Force nbconvert to use the standard python3 kernel instead of 'Python [Root]'
      - name: Run Jupyter Notebook
        run: |
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor
